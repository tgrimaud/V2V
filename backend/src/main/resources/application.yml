spring:
  application:
    name: voice-support-bot

  datasource:
    url: jdbc:postgresql://localhost:5433/voicesupport
    username: voicesupport
    password: voicesupport

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_MODEL:llama3.1:8b}
        options:
          temperature: 0.3
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    mistralai:
      api-key: ${MISTRAL_API_KEY:}
      chat:
        options:
          model: ${MISTRAL_MODEL:mistral-small-latest}
          temperature: 0.3

    vectorstore:
      pgvector:
        dimensions: 768
        index-type: hnsw
        distance-type: cosine_distance
        initialize-schema: true

server:
  port: 8081

voice-support:
  llm:
    provider: ${LLM_PROVIDER:mistral-api}
  tts:
    provider: piper
    piper:
      host: localhost
      port: 10200
  stt:
    provider: deepgram
    deepgram:
      api-key: ${DEEPGRAM_API_KEY:}
  knowledge:
    chunk-size: 500
    chunk-overlap: 50
