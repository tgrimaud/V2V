spring:
  application:
    name: voice-support-bot

  datasource:
    url: jdbc:postgresql://localhost:5433/voicesupport
    username: voicesupport
    password: voicesupport

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3.1:8b
        options:
          temperature: 0.3
      embedding:
        model: nomic-embed-text

    vectorstore:
      pgvector:
        dimensions: 768
        index-type: hnsw
        distance-type: cosine_distance
        initialize-schema: true

server:
  port: 8081

voice-support:
  tts:
    provider: piper
    piper:
      host: localhost
      port: 10200
  stt:
    provider: deepgram
    deepgram:
      api-key: ${DEEPGRAM_API_KEY:}
  knowledge:
    chunk-size: 500
    chunk-overlap: 50
