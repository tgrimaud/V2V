spring:
  application:
    name: voice-support-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/voicesupport}
    username: ${DB_USERNAME:voicesupport}
    password: ${DB_PASSWORD:voicesupport}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
      chat:
        model: ${OLLAMA_CHAT_MODEL:llama3.1:8b}
        options:
          # Low temperature for the wording step reduces non-deterministic refusals despite
          # grounded evidence (BUG-004). Tunable via OLLAMA_CHAT_TEMPERATURE.
          temperature: ${OLLAMA_CHAT_TEMPERATURE:0.2}
    mistralai:
      api-key: ${MISTRAL_API_KEY:}
      chat:
        options:
          model: ${MISTRAL_CHAT_MODEL:mistral-small-latest}
          # Low temperature for the wording step reduces non-deterministic refusals despite
          # grounded evidence (BUG-004). Tunable via MISTRAL_CHAT_TEMPERATURE.
          temperature: ${MISTRAL_CHAT_TEMPERATURE:0.2}
    vectorstore:
      pgvector:
        # Embedding dimension is fixed at table creation. Changing the embedding
        # model requires recreating vector_store + a full re-sync.
        dimensions: 768
        index-type: hnsw
        distance-type: cosine_distance
        initialize-schema: true

server:
  port: 8080

# OpenAPI 3 / Swagger UI (TASK-BE-016). The spec is served at /v3/api-docs (JSON) and
# /v3/api-docs.yaml (YAML); the interactive UI at /swagger-ui.html. Paths are pinned
# explicitly so they stay stable if a springdoc default changes.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# Observability (TASK-BE-009): expose Micrometer metrics via actuator so per-slice latency
# (voice_support.slice, tagged slice/channel/provider/outcome) is queryable locally with
# client-side p50/p95/p99 percentiles.
#
# OTLP export (TASK-OBS-001, ADR-0028 addendum) is ADDITIVE and DEFAULT OFF:
#   - metrics export is disabled unless OTEL_METRICS_EXPORT_ENABLED=true;
#   - trace sampling is 0.0 unless OTEL_TRACES_SAMPLER_ARG>0.
# With both inert, nothing is recorded/shipped and no collector connection is attempted, so
# offline tests and normal startup are unchanged. Point OTEL_EXPORTER_OTLP_ENDPOINT at the
# opt-in collector (deploy/observability/) and flip the two flags to export.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles:
        voice_support.slice: 0.5, 0.95, 0.99
  otlp:
    metrics:
      export:
        enabled: ${OTEL_METRICS_EXPORT_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: ${OTEL_METRICS_EXPORT_STEP:10s}
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:0.0}

voice-support:
  knowledge:
    chunk-size: 500
    chunk-overlap: 50
    markdown-path: ${KB_MARKDOWN_PATH:../knowledge-base}
    default-language: ${KB_DEFAULT_LANGUAGE:fr}
    # CSV article connector (TASK-BE-013, ADR-0030). articles.csv (document_id,title,content
    # with rich HTML) lives at the repo root; the backend runs from backend/, hence ../.
    # A missing file degrades to an empty sync (no startup failure).
    csv-path: ${KB_CSV_PATH:../articles.csv}
    csv-language: ${KB_CSV_LANGUAGE:en}
    classifier:
      # Ingestion-time domain classification (ADR-0030): cosine of the article embedding vs
      # per-domain anchors; below threshold the article stays "general". Both are tunable
      # because the right cutoff depends on the corpus (best-effort, general is the safe default).
      # Calibrated on a 150-article live run of the real Eir corpus (nomic-embed-text, no task
      # prefix → compressed cosine range ~0.49-0.80, median ~0.60): 0.55 sends the genuinely
      # cross-cutting/ambiguous tail (~13%: GDPR, privacy, internal agent tooling) to "general"
      # while keeping confident billing/support/commercial picks. See the TASK-BE-013 QA report.
      threshold: ${KB_CLASSIFIER_THRESHOLD:0.55}
      max-chars: ${KB_CLASSIFIER_MAX_CHARS:2000}
    audience:
      # Audience boundary (ADR-0034, BUG-005): the operator CSV corpus mixes customer-facing and
      # internal/back-office agent articles with no audience column. An article whose title/content
      # matches any of these unambiguous agent-desk markers is tagged audience=internal at ingestion
      # (JSONB metadata) and is fail-closed excluded from the customer answer engine's retrieval.
      # Deterministic + high-precision on purpose (over-tagging would hide legitimate answers); the
      # comparison is lowercased and accent-folded, acronyms match on word boundaries. Extend this
      # list to widen the internal partition without a rebuild. Activating the boundary requires a
      # full KB re-sync so every chunk carries an audience value.
      internal-markers: ${KB_AUDIENCE_INTERNAL_MARKERS:back office,vérification d'aptitude,r6/ion,vaa,vrd}
    # Bulk-sync observability cadence (TASK-BE-014): every N ingested documents the sync emits a
    # [KB-SYNC] op=progress line. Per-batch detail stays at DEBUG; per-batch timing + throughput
    # are always exposed as Micrometer meters (voice_support.kb_sync_batch / kb_sync_chunks /
    # kb_sync, tagged source_type). Raise it for very large corpora to keep the log quiet.
    sync-progress-every: ${KB_SYNC_PROGRESS_EVERY:500}
  conversation:
    # Post-retrieval guardrail (ADR-0014): answers grounded only on evidence whose
    # best similarity score reaches this threshold. Provisional value per ADR-0021;
    # the definitive answer threshold is gated by OQ-002.
    confidence-threshold: ${CONVERSATION_CONFIDENCE_THRESHOLD:0.5}
    # Weak-confidence clarify band (ADR-0034, BUG-005). Between confidence-threshold (floor,
    # advisor hand-off) and this ceiling, a middle-confidence retrieval makes the bot ask the
    # customer to clarify rather than voicing a weakly-matched (possibly wrong-audience) article.
    # Set clarify-threshold <= confidence-threshold to disable the clarify band. Tune on measured
    # data; the definitive billing proof threshold stays gated by OQ-002.
    clarify-threshold: ${CONVERSATION_CLARIFY_THRESHOLD:0.62}
    # Vague/low-information turn markers (ADR-0034, BUG-005). A turn made only of these contentless
    # continuers (up to 3 tokens) is answered with a clarification prompt before any retrieval/LLM
    # call — so "vas-y" no longer retrieves a weak internal match. Comparison is lowercased and
    # accent-folded. Extend per deployment/language without a rebuild.
    vague-markers: ${CONVERSATION_VAGUE_MARKERS:vas-y,vas y,allez-y,allez y,continue,continuez,poursuis,poursuivez,ensuite,la suite,go,go on,go ahead,ok,okay,d'accord,dac,dacc,alors,donc,bah,ben,euh,hmm,voila,voilà,et}
    # Answer-language default (TASK-BE-015, ADR-0031). The assistant answers in the language of the
    # customer's question (FR/EN); this default is used only when a turn is too ambiguous to detect
    # and no session language is established yet. English for the Eir pilot; set to fr for a French
    # deployment. This is the ANSWER language, distinct from voice-support.knowledge.default-language
    # (the KB ingestion language tag).
    default-language: ${CONVERSATION_DEFAULT_LANGUAGE:en}
    retrieval:
      # Number of KB chunks injected as LLM context on the voice /converse[-stream] paths
      # (TASK-BE-011). This is the main driver of prompt size, hence of LLM time-to-first-token:
      # fewer chunks = shorter prompt = faster first token, at the cost of less grounding breadth.
      # Tunable without a code change; re-measure backend_first_token when adjusting.
      # BUG-003: raised 4 -> 8 to over-fetch so the answer-bearing chunk is not evicted by
      # near-duplicate keyword-dense chunks under a brittle dense-only top-K.
      top-k: ${CONVERSATION_RETRIEVAL_TOP_K:8}
    # ADR-0021 shared secret for the write/read API. When set, requests must carry a
    # matching x-api-key header on every protected path: POST /api/conversation/converse[-stream]
    # (inline gate), POST /api/conversation/answer, POST /api/conversation/retrieve and all
    # /api/knowledge/** ingestion + sync endpoints (central ApiKeyAuthInterceptor, TASK-BE-019).
    # Empty = open (localhost pilot only); any non-localhost deployment MUST set this.
    api-key: ${CONVERSATION_API_KEY:}
    memory:
      # Short conversation memory (TASK-BE-006): prior turns per conversation placed in the
      # LLM system message (current turn excluded). Process-local; a shared store is a later
      # concern. max-turns = retained exchanges/conversation; max-conversations = LRU cap.
      max-turns: ${CONVERSATION_MEMORY_MAX_TURNS:6}
      max-conversations: ${CONVERSATION_MEMORY_MAX_CONVERSATIONS:10000}
  llm:
    # LLM wording provider (DEC-011), selectable without any domain change:
    #   mistral-api = development default (mistral-small-latest)
    #   ollama      = local/offline alternative (llama3.1:8b)
    # Embeddings always stay on Ollama (nomic-embed-text, 768d); this only selects chat.
    provider: ${LLM_PROVIDER:mistral-api}
    # Hard timeout for the LLM wording call (TASK-BE-012). A slower/hung provider degrades to a
    # sanitized 503 ERR_UPSTREAM (the voice runtime then speaks a safe degraded turn). 0 disables.
    # This value is also applied as the provider HTTP read timeout so a stalled socket is closed
    # (not just abandoned by the executor); raise it when selecting the slower local ollama chat.
    timeout-ms: ${LLM_TIMEOUT_MS:8000}
    # Provider HTTP connect timeout for the chat call (TASK-BE-012). Bounds the pre-read handshake
    # so a dead/unreachable endpoint fails fast rather than hanging a bounded LLM worker thread.
    connect-timeout-ms: ${LLM_CONNECT_TIMEOUT_MS:3000}
    # Voice-first answer-length budget (TASK-BE-018). Appended per call as a concision directive in
    # the answer language, capping the spoken answer so long grounded answers stop dominating TTS
    # synthesis time (batch TTFA + live spoken tail). Does not weaken grounding (DEC-002 / BUG-004):
    # concise-but-complete, still hands off only when the context is empty/unrelated. 0 disables.
    max-answer-sentences: ${LLM_MAX_ANSWER_SENTENCES:3}
  observability:
    # Allow-list bounding the `channel` metric tag cardinality (TASK-BE-009). A client-supplied
    # channel outside this list collapses to `other` on the metric tag; the raw value stays in
    # the [CONVERSE] log. Extend this list when onboarding a new channel (e.g. sms).
    # `web_voice` is the web Voice2Voice runtime channel (TASK-BE-008) — kept first-class so the
    # real spoken path is reportable per channel instead of collapsing into `other`.
    allowed-channels: ${OBSERVABILITY_ALLOWED_CHANNELS:web,web_voice,phone,whatsapp,api}
