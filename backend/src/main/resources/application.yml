spring:
  application:
    name: voice-support-bot

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/voicesupport}
    username: ${DB_USERNAME:voicesupport}
    password: ${DB_PASSWORD:voicesupport}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_MODEL:llama3.1:8b}
        options:
          temperature: 0.3
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    mistralai:
      api-key: ${MISTRAL_API_KEY:}
      chat:
        options:
          model: ${MISTRAL_MODEL:mistral-small-latest}
          temperature: 0.3

    vectorstore:
      pgvector:
        dimensions: 768
        index-type: hnsw
        distance-type: cosine_distance
        initialize-schema: true

server:
  port: 8081

voice-support:
  llm:
    provider: ${LLM_PROVIDER:mistral-api}
  knowledge:
    chunk-size: 500
    chunk-overlap: 50
    markdown-path: ${KB_MARKDOWN_PATH:../knowledge-base}
    default-language: ${KB_DEFAULT_LANGUAGE:fr}
    # Cron de synchro KB (pull planifie). Mettre "-" pour desactiver.
    sync-cron: ${KB_SYNC_CRON:0 0 * * * *}
