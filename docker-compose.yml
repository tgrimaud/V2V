services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: voicesupport
      POSTGRES_USER: voicesupport
      POSTGRES_PASSWORD: voicesupport
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  voice-agent:
    build: ./voice-agent
    ports:
      - "8765:8765"
      - "8766:8766"
    environment:
      GRADIUM_API_KEY: ${GRADIUM_API_KEY}
      GRADIUM_VOICE_ID: ${GRADIUM_VOICE_ID:-default}
      BACKEND_URL: http://host.docker.internal:8081
      VOICE_AGENT_HOST: "0.0.0.0"
      VOICE_AGENT_PORT: "8765"
      TWILIO_WS_PORT: "8766"
    depends_on:
      - postgres

volumes:
  pgdata:
