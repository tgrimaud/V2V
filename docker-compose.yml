# Local development infrastructure for the Voice Support Bot backend.
# BE-003 needs: Postgres (pgvector, 768-dim vector_store) + Ollama (nomic-embed-text embeddings).
#
# Ollama can also run natively on the host (http://localhost:11434). If it does,
# start only Postgres: `docker compose up -d postgres`.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: voicesupport
      POSTGRES_USER: voicesupport
      POSTGRES_PASSWORD: voicesupport
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # TASK-INFRA-009 / ADR-0041: create `vector` + `uuid-ossp` on first init (empty volume), since
      # Spring AI initialize-schema is now off and Liquibase (app user) can't create extensions.
      - ./scripts/dev-db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicesupport"]
      interval: 5s
      timeout: 3s
      retries: 15

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
  ollamadata:
