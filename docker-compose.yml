services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: voicesupport
      POSTGRES_USER: voicesupport
      POSTGRES_PASSWORD: voicesupport
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]

  backend:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /workspace/backend
    command: mvn spring-boot:run
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/voicesupport
      DB_USERNAME: voicesupport
      DB_PASSWORD: voicesupport
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CONVERSATION_STORE: redis
      CONVERSATION_EVENT_STORE: jpa
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-small-latest}
      LLM_PROVIDER: ${LLM_PROVIDER:-mistral-api}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      KB_MARKDOWN_PATH: /workspace/knowledge-base
    volumes:
      - .:/workspace
      - maven-cache:/root/.m2
    depends_on:
      - postgres
      - redis

  voice-agent:
    build: ./voice-agent
    ports:
      - "8765:8765"
      - "8766:8766"
    environment:
      GRADIUM_API_KEY: ${GRADIUM_API_KEY:-}
      GRADIUM_VOICE_ID: ${GRADIUM_VOICE_ID:-default}
      BACKEND_URL: http://backend:8081
      VOICE_AGENT_HOST: "0.0.0.0"
      VOICE_AGENT_PORT: "8765"
      TWILIO_WS_PORT: "8766"
    depends_on:
      - backend

  pipecat-agent:
    build: ./voice-agent
    command: ["python", "-m", "agent.bot", "-t", "webrtc", "--host", "0.0.0.0", "--port", "7860"]
    ports:
      - "7860:7860"
    environment:
      GRADIUM_API_KEY: ${GRADIUM_API_KEY:-}
      GRADIUM_VOICE_ID: ${GRADIUM_VOICE_ID:-default}
      BACKEND_URL: http://backend:8081
    depends_on:
      - backend

  frontend:
    image: node:22-alpine
    working_dir: /workspace/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8081
      VITE_WS_PROXY_TARGET: ws://backend:8081
      VITE_VOICE_AGENT_URL: ws://localhost:8765
      VITE_BOT_URL: http://localhost:7860
    volumes:
      - .:/workspace
      - frontend-node-modules:/workspace/frontend/node_modules
    depends_on:
      - backend
      - voice-agent
      - pipecat-agent

volumes:
  pgdata:
  redisdata:
  maven-cache:
  frontend-node-modules:
