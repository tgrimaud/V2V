services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: voicesupport
      POSTGRES_USER: voicesupport
      POSTGRES_PASSWORD: voicesupport
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  piper:
    image: rhasspy/wyoming-piper:latest
    ports:
      - "10200:10200"
    command: --voice fr_FR-siwis-medium
    volumes:
      - piper_data:/data

volumes:
  pgdata:
  ollama_data:
  piper_data:
