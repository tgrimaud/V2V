# Build & push the two service images (TASK-OPS-001, ADR-0038).
# Publishes to GHCR (native to GitHub Actions, authenticated with GITHUB_TOKEN - no
# extra secret). If the platform selects an internal registry (Nexus/Artifactory,
# open input #5), override REGISTRY + the login step and add registry creds as secrets.
#
# Tag/version scheme (reused by the Ansible deploy - TASK-OPS-002):
#   - immutable git SHA          -> sha-<12>
#   - semantic release version   -> from a vX.Y.Z git tag
#   - moving mainline pointer     -> "latest" on the default branch only
name: Build and push images

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - feat/restart-from-scratch
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # Gate: never publish an image from an untested ref (e.g. a release tag that does
  # not trigger ci.yml). Reuses the exact same suite as the PR gate.
  tests:
    uses: ./.github/workflows/tests.yml

  build-push:
    name: ${{ matrix.name }} image
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            dockerfile: backend/Dockerfile
            image: voice-support-backend
          - name: voice
            context: voice-agent
            dockerfile: voice-agent/Dockerfile
            image: voice-support-voice
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # GHCR requires a lowercase namespace; owners can contain uppercase.
      - name: Resolve lowercase image name
        id: img
        run: echo "ref=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ steps.img.outputs.ref }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/feat/restart-from-scratch' }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
