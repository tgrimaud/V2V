# Prometheus scrape config for the pilot observability stack (TASK-OPS-007).
# It scrapes the OpenTelemetry Collector's Prometheus exporter, which re-exports the OTLP
# metrics shipped by the backend (Micrometer) and the voice runtime. The backend already
# publishes p50/p95/p99 on the `voice_support.slice` timer (see application.yml
# management.metrics.distribution), so those percentiles land here as
# voice_support_slice_* series filterable by slice / channel / provider / outcome.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
