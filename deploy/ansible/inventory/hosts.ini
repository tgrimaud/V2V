; eir-ai4cc-tst inventory (TASK-OPS-002, ADR-0038).
; Source of truth: docs/operations/deployment-eir-ai4cc-tst.md (VM inventory).
; SSH/Ansible over the .prod.lan interface, resolved by DNS (no pinned ansible_host
; IP). Service/data traffic and the VIPs stay on the 192.168.0.0/24 subnet
; (VIP .10 voice / .11 backend); haproxy/keepalived/firewall keep those IPs.
; become via sudo. Deploy targets = redis, backend, voice. `data` and `lb` are
; platform-managed (Postgres pod, HAProxy) and listed for reference / future
; automation only.

[redis]
vlb-ai4cc-t02.prod.lan

[backend]
vla-ai4cc-t03.prod.lan
vla-ai4cc-t04.prod.lan

[voice]
vla-ai4cc-t01.prod.lan
vla-ai4cc-t02.prod.lan

; ---- reference only (not deployed by these playbooks) ----------------------
[data]
vlb-ai4cc-t01.prod.lan

[lb]
vlp-ai4cc-t01.prod.lan
vlp-ai4cc-t02.prod.lan

; Convenience group for the two containerised app tiers.
[app:children]
backend
voice
