[defaults]
inventory = inventory/hosts.ini
roles_path = roles
host_key_checking = True
retry_files_enabled = False
# SSH access per docs/operations/deployment-eir-ai4cc-tst.md: ssh grimaud@<host>.mt.lan
remote_user = grimaud
stdout_callback = yaml

[privilege_escalation]
become = True
become_method = sudo
become_user = root
