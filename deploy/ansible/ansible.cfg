[defaults]
inventory = inventory/hosts.ini
roles_path = roles
host_key_checking = True
retry_files_enabled = False
# SSH access per docs/operations/deployment-eir-ai4cc-tst.md: ssh grimaud@<host>.prod.lan
remote_user = grimaud
stdout_callback = yaml
# Local ansible-vault: master password in .vault_pass (git-ignored). Override with
# --vault-password-file / --ask-vault-pass. Rotate by re-encrypting vault.yml.
vault_password_file = .vault_pass

[privilege_escalation]
become = True
become_method = sudo
become_user = root
