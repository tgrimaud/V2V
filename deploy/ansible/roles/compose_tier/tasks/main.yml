---
# Deploy one tier's docker-compose stack at {{ image_tag }} (TASK-OPS-002).
# Idempotent: re-running with the same tag is a no-op for compose.

- name: "Ensure the {{ tier }} stack directory exists"
  ansible.builtin.file:
    path: "{{ compose_root }}/{{ compose_src }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: "Copy the {{ tier }} docker-compose.yml"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../compose/{{ compose_src }}/docker-compose.yml"
    dest: "{{ compose_root }}/{{ compose_src }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"

- name: "Render the {{ tier }} .env from vault + group vars"
  ansible.builtin.template:
    src: "{{ tier }}.env.j2"
    dest: "{{ compose_root }}/{{ compose_src }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: "Log in to the registry ({{ registry }})"
  ansible.builtin.shell:
    cmd: "docker login {{ registry }} -u {{ vault_registry_username }} --password-stdin"
    stdin: "{{ vault_registry_token }}"
  when: registry_login_required | bool
  no_log: true
  changed_when: false

# Backend tier only: drop the KB assets the container mounts read-only, so the
# first sync can populate pgvector (the image does not bundle the KB).
- name: "Provision the knowledge base assets"
  ansible.builtin.include_tasks: kb_assets.yml
  when: tier == 'backend'

# Voice tier only: stop new calls + let in-flight calls wind down before recreate.
- name: "Drain the voice bridge before recreate"
  ansible.builtin.include_tasks: drain.yml
  when: tier == 'voice'

- name: "Pull the {{ tier }} image at tag {{ image_tag }}"
  ansible.builtin.command:
    cmd: "{{ compose_cmd }} pull"
    chdir: "{{ compose_root }}/{{ compose_src }}"
  environment:
    IMAGE_TAG: "{{ image_tag }}"
  changed_when: true

- name: "Bring the {{ tier }} stack up at tag {{ image_tag }}"
  ansible.builtin.command:
    cmd: "{{ compose_cmd }} up -d --remove-orphans"
    chdir: "{{ compose_root }}/{{ compose_src }}"
  environment:
    IMAGE_TAG: "{{ image_tag }}"
  changed_when: true

# Drop the registry credentials from the host now that the images are local
# (TASK-OPS-004): the login above is only needed for the pull, so leaving the token
# cached in ~/.docker/config.json is an unnecessary credential-at-rest surface. The
# next deploy logs in again. The Ollama model pull + health checks below need no creds.
- name: "Log out of the registry (drop cached credentials)"
  ansible.builtin.command:
    cmd: "docker logout {{ registry }}"
  when: registry_login_required | bool
  changed_when: false
  no_log: true

# Backend tier only: pull the embeddings model into the co-located Ollama sidecar.
- name: "Pull the embeddings model into the Ollama sidecar"
  ansible.builtin.include_tasks: ollama_model.yml
  when: tier == 'backend'

- name: "Verify the {{ tier }} stack is healthy"
  ansible.builtin.include_tasks: health.yml

# Redis + Postgres backup schedule (TASK-OPS-008): no-op on the voice tier and when
# the per-tier backup flag is false.
- name: "Install scheduled data backups"
  ansible.builtin.include_tasks: backup.yml
  when: tier in ['redis', 'backend']

# Voice tier only: put the node back in rotation once healthy.
- name: "Re-enable the voice bridge in the load balancer"
  ansible.builtin.command:
    cmd: "{{ voice_lb_enable_cmd }}"
  when:
    - tier == 'voice'
    - voice_lb_enable_cmd | length > 0
  changed_when: true
