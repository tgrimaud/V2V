---
# Post-deploy health verification (TASK-OPS-002).
# HTTP tiers (backend, voice) poll their health URL; Redis pings via the CLI.

# Preferred readiness probe when the tier's container defines a HEALTHCHECK
# (TASK-INFRA-011): poll the container's own health verdict via `docker inspect`.
# The container healthcheck runs INSIDE the container namespace (curl/urllib to
# localhost), so it is immune to the host-side interface/firewall/loopback quirks
# that made the host `uri` probe unreliable on the voice bridge — the published
# port answers on the 192.168.x service IP but returns 000 on host loopback and is
# firewalld source-scoped (TASK-OPS-004) on the management interface. Falls back to
# the HTTP `uri` probe below when no health_container_name is set (e.g. backend).
- name: "Wait for {{ tier }} container to report healthy ({{ health_container_name | default('') }})"
  ansible.builtin.command:
    cmd: "docker inspect --format {% raw %}{{.State.Health.Status}}{% endraw %} {{ health_container_name }}"
  register: container_health
  until: "'healthy' in container_health.stdout"
  retries: 30
  delay: 5
  changed_when: false
  when: health_container_name | default('') | length > 0

- name: "Wait for {{ tier }} HTTP health at {{ health_url }}"
  ansible.builtin.uri:
    url: "{{ health_url }}"
    status_code: 200
  register: health_probe
  until: health_probe.status == 200
  retries: 30
  delay: 5
  when:
    - health_url | length > 0
    - health_container_name | default('') | length == 0

# Pass the password via REDISCLI_AUTH (env) rather than `-a` so it never appears
# in the container's process argv (visible to `ps` on the host).
- name: "Ping Redis via the container CLI"
  ansible.builtin.command:
    cmd: >-
      docker exec -e REDISCLI_AUTH={{ vault_redis_password }}
      {{ redis_container_name }} redis-cli ping
  register: redis_ping
  until: "'PONG' in redis_ping.stdout"
  retries: 12
  delay: 5
  changed_when: false
  no_log: true
  when: tier == 'redis'

- name: "Assert Redis answered PONG"
  ansible.builtin.assert:
    that: "'PONG' in redis_ping.stdout"
    fail_msg: "Redis did not answer PONG after deploy"
  when: tier == 'redis'
