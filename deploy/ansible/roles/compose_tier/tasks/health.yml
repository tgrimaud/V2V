---
# Post-deploy health verification (TASK-OPS-002).
# HTTP tiers (backend, voice) poll their health URL; Redis pings via the CLI.

- name: "Wait for {{ tier }} HTTP health at {{ health_url }}"
  ansible.builtin.uri:
    url: "{{ health_url }}"
    status_code: 200
  register: health_probe
  until: health_probe.status == 200
  retries: 30
  delay: 5
  when: health_url | length > 0

- name: "Ping Redis via the container CLI"
  ansible.builtin.command:
    cmd: >-
      docker exec {{ redis_container_name }}
      redis-cli -a {{ vault_redis_password }} ping
  register: redis_ping
  until: "'PONG' in redis_ping.stdout"
  retries: 12
  delay: 5
  changed_when: false
  no_log: true
  when: tier == 'redis'

- name: "Assert Redis answered PONG"
  ansible.builtin.assert:
    that: "'PONG' in redis_ping.stdout"
    fail_msg: "Redis did not answer PONG after deploy"
  when: tier == 'redis'
