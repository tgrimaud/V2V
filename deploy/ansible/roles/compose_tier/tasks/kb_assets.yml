---
# Provision the knowledge base assets the backend mounts read-only (TASK-OPS-002).
# The image does not bundle the KB (DEPLOY-001); Ansible drops the repo's
# knowledge-base/*.md + the CSV corpus ({{ kb_csv_filename }}) under KB_HOST_PATH so the
# post-deploy POST /api/knowledge/sync (kb_sync.yml) can populate pgvector. Without this
# the RAG stays empty.
# ADR-0048 / TASK-OPS-009: the CSV corpus is the FRENCH articles-fr.csv by default (pilot
# users are French → FR-on-FR retrieval). kb_csv_filename selects the repo-root file.

- name: "Ensure the KB directory exists"
  ansible.builtin.file:
    path: "{{ kb_host_path }}/knowledge-base"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "Copy the knowledge-base markdown sources"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../knowledge-base/"
    dest: "{{ kb_host_path }}/knowledge-base/"
    owner: root
    group: root
    mode: "0644"
  register: kb_md_copy

- name: "Copy the CSV article corpus ({{ kb_csv_filename }})"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../{{ kb_csv_filename }}"
    dest: "{{ kb_host_path }}/{{ kb_csv_filename }}"
    owner: root
    group: root
    mode: "0644"
  register: kb_csv_copy

# TASK-BE-034 / ADR-0048 bilingual: also drop the FR corpus when the language filter is on, so a
# re-sync loads both source_types (csv-article + csv-article-fr) into the shared store.
- name: "Copy the French CSV article corpus ({{ kb_csv_fr_filename | default('articles-fr.csv') }})"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../{{ kb_csv_fr_filename }}"
    dest: "{{ kb_host_path }}/{{ kb_csv_fr_filename }}"
    owner: root
    group: root
    mode: "0644"
  when: kb_retrieval_language_filter_enabled | default(false) | bool
  register: kb_csv_fr_copy

# TASK-OPS-011: record whether any mounted KB source actually changed this deploy. The post-deploy
# sync (kb_sync.yml) is skipped when nothing changed, because POST /api/knowledge/sync re-classifies
# every article via a CPU-Ollama embedding at parse time (ADR-0030) — a full pass runs > 40 min and
# previously timed out and aborted the roll on every (even unchanged) code-only redeploy. The
# ansible.builtin.copy modules above already compare content checksums, so `is changed` is an exact
# "KB source differs from what's on the host" signal; a fresh host reports changed (files created) so
# the first sync still runs. The FR copy may be skipped (register still defined, changed=false then).
- name: "Record whether the mounted KB assets changed this deploy (TASK-OPS-011)"
  ansible.builtin.set_fact:
    kb_assets_changed: "{{ (kb_md_copy is changed) or (kb_csv_copy is changed) or (kb_csv_fr_copy is defined and (kb_csv_fr_copy is changed)) }}"
