---
# Backend Java tier (vla-t03/t04, behind VIP .11). Non-secret config; secrets
# come from group_vars/all/vault.yml. Mirrors deploy/compose/backend/.env.example.
tier: "backend"
compose_src: "backend"

# HTTP health probed after `up -d` (ungated, see deployment doc).
health_url: "http://127.0.0.1:8080/actuator/health"

backend_bind: "0.0.0.0"
backend_port: 8080

# Published port opened in firewalld by host_prereqs (TASK-OPS-003).
firewall_port: 8080

# Least privilege (TASK-OPS-004): 8080 is reached ONLY by the HAProxy LB nodes
# (backend VIP .11 -> t03/t04); the voice tier always goes through the VIP, so the
# proxied source is an LB node. Source-scoped firewalld rich rules; empty = open to all.
firewall_allowed_sources:
  - "192.168.0.100/32"   # vlp-t01 HAProxy
  - "192.168.0.101/32"   # vlp-t02 HAProxy

# Postgres .102 (pgvector 768 dim).
db_url: "jdbc:postgresql://192.168.0.102:5432/voicesupport"
db_username: "voicesupport"

# Embeddings (ADR-0039): Ollama nomic-embed-text CPU sidecar co-located on each
# backend VM, reached over the compose network. The model is pulled at deploy time.
ollama_base_url: "http://ollama:11434"
ollama_embedding_model: "nomic-embed-text"
ollama_image_tag: "0.5.4"
ollama_cpus: "1.0"
ollama_memory: "2g"
# BUG-014: pin the ollama sidecar to a static IP on a stable user-defined network and
# resolve the "ollama" name via /etc/hosts (extra_hosts) so it survives container/network
# churn without a `down && up`. ollama_static_ip must be inside backend_net_subnet; the
# default subnet avoids podman's 10.89.0.0/16 pool (override if it collides on the VM).
ollama_static_ip: "10.123.0.11"
backend_net_subnet: "10.123.0.0/24"
# Deep readiness includes the embedding hop: /actuator/health returns 503 when ollama is
# unreachable so HAProxy drains the node (true on this tier; ollama is present).
embedding_health_enabled: true

# Chat LLM (provider-selectable, DEC-011 / ADR-0051). The application/local default is
# openai (gpt-5). The pilot originally pinned mistral-api (the validated path) until the
# ADR-0045 / TASK-BE-033 benchmark, but was switched to OpenAI gpt-5 on 2026-09-17: the pilot
# Mistral key was hard rate-limited on light traffic (HTTP 429 "Rate limit exceeded", code
# 1300 from api.mistral.ai), so every real answer degraded to the safe fallback. Revert to
# "mistral-api" once the Mistral quota is raised (or after the ADR-0045 benchmark decides).
# OpenAI key comes from vault_openai_api_key; openai_base_url below is the ROOT (no /v1).
llm_provider: "openai"
mistral_chat_model: "mistral-small-latest"
# OpenAI (used only when llm_provider == openai). base-url is the ROOT without /v1
# (Azure AI Foundry: https://<resource>.services.ai.azure.com/openai). Key comes from vault.
openai_base_url: "https://Ai4cc-POC-SWD.services.ai.azure.com/openai"
openai_chat_model: "gpt-5"
openai_reasoning_effort: "minimal"

# Shared conversation memory (Redis .107, ADR-0008 / TASK-BE-021).
conversation_store: "redis"
redis_host: "192.168.0.107"
redis_port: 6379
redis_timeout: "2s"
conversation_memory_ttl_seconds: 3600
redis_health_enabled: true

# Knowledge base assets mounted read-only into the container.
kb_host_path: "{{ compose_root }}/backend/kb-assets"

# KB CSV corpus (ADR-0048 / TASK-OPS-009). The Eir pilot is ENGLISH (TASK-OPS-013): the single
# CSV source is the original English Eir corpus (articles-en.csv, ~306 articles), so EN-on-EN
# retrieval grounds billing/support questions that otherwise deflect to an advisor. Answer
# language is already per-request (ADR-0031), so this only affects retrieval relevance.
# articles-en.csv references eir/eircom by design — it IS the Eir KB (no rebrand needed;
# TASK-BE-035 cancelled). The French corpus articles-fr.csv is a translation kept for the
# bilingual target (load both corpora + a retrieval language filter, TASK-BE-034) — not
# enabled on this single-corpus pilot. kb_csv_filename is the repo-root file Ansible copies
# and the container reads via KB_CSV_PATH=/app/kb-assets/{{ kb_csv_filename }}.
kb_csv_filename: "articles-en.csv"
kb_csv_language: "en"

# Post-deploy KB sync (TASK-OPS-009). After the stack is healthy, trigger
# POST /api/knowledge/sync so a (re)deploy never leaves the RAG markdown-only or empty
# (the image ships no KB; the sync loads the mounted assets into pgvector). Idempotent:
# a second run skips unchanged sources by content_hash. Backend tier only.
#
# BUG-022 (FIXED): the store phase used to embed a whole document in ONE vectorStore.add(...),
# so a large article (hundreds of chunks) produced one huge embedding call the client's
# per-read timeout could not bound (it fires on a read gap, not overall) — a single slow/hung
# batch stalled the entire sync forever, saturated the Ollama sidecar (live retrieval → 503
# ERR_UPSTREAM) and, with serial:1/max_fail_percentage:0 + the 90x30s poll, aborted the whole
# rollout. Fixed in PgVectorStoreAdapter: chunks are now embedded in bounded batches
# (KB_STORE_BATCH_SIZE, default 32) so each request stays short enough for the read timeout to
# bite, and a batch that still fails/times out is skipped + logged instead of hanging. Blank
# chunks are dropped. Auto-sync is therefore RE-ENABLED: a (re)deploy always terminates
# (idempotent — unchanged sources skip by content_hash, so re-deploys finish in seconds).
kb_sync_after_deploy: true
# The first CSV sync is slow: ~300 articles are embedded on the CPU Ollama sidecar AND
# each is domain-classified by an embedding call at parse time (ADR-0030), so a full run
# takes ~15-30 min on the pilot. kb_sync.yml fires the sync async (poll:0) and waits via
# async_status: poll every kb_sync_poll_delay s, up to kb_sync_poll_retries times
# (90 * 30 s = 45 min headroom). Idempotent re-deploys finish in seconds.
kb_sync_timeout: 2400          # async worker's own HTTP read timeout (s)
kb_sync_async_seconds: 2700    # async job max lifetime (s)
kb_sync_poll_retries: 90       # async_status polls
kb_sync_poll_delay: 30         # seconds between polls
# Deploy gate: the aggregate SyncReport.processed must be >= this (markdown baseline is 3,
# the EN corpus adds ~306) to prove the CSV corpus was seen and the RAG is not markdown-only.
kb_sync_min_processed: 50

# JVM / resource sizing (4 vCPU / 8 GB VM, shared with the ollama sidecar).
# The embedding read timeout (voice-support.embedding.timeout-ms, default 5s) is sized for a
# single per-query embedding at retrieval; the one-shot KB sync embeds a large batch in one
# Ollama call on CPU and needs more headroom, so raise it here (Spring property override via
# JAVA_OPTS). Runtime retrieval stays fast-fail-protected by voice-support.retrieval.timeout-ms.
java_opts: "-XX:MaxRAMPercentage=75.0 -Dvoice-support.embedding.timeout-ms=120000"
backend_cpus: "3.0"
backend_memory: "5g"

# ---- Postgres backup schedule (TASK-OPS-008) --------------------------------
# Daily pg_dump -Fc of the KB + pgvector DB (.102), run from ONE backend node via a
# throwaway postgres client container (no client install). Restore + KB re-sync are in
# deploy/backup/pg-restore.sh + docs/operations/backup-restore.md. Set pg_backup_remote
# to protect against losing the Postgres VM.
pg_backup_enabled: true
pg_backup_host: "192.168.0.102"
pg_backup_port: 5432
pg_backup_database: "voicesupport"
pg_client_image: "postgres:18-alpine"
pg_backup_dir: "/var/backups/voice-support/postgres"
pg_backup_cron_minute: "37"
pg_backup_cron_hour: "2"          # daily 02:37
pg_backup_keep: 14                 # ~2 weeks of daily dumps
pg_backup_remote: ""               # e.g. "backup@vlb-ai4cc-t01.prod.lan:/srv/backups/postgres"
