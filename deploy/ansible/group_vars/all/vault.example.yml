---
# SECRETS TEMPLATE - do NOT fill this file in place and do NOT commit real values.
#
# Setup:
#   cp group_vars/all/vault.example.yml group_vars/all/vault.yml
#   # fill real values, then encrypt:
#   ansible-vault encrypt group_vars/all/vault.yml
# vault.yml is git-ignored (see deploy/ansible/.gitignore). Run playbooks with
#   ansible-playbook deploy.yml --ask-vault-pass   (or --vault-password-file)

vault_db_password: "CHANGE_ME"
vault_mistral_api_key: "CHANGE_ME"
# The single shared API key: backend CONVERSATION_API_KEY == voice VOICE_BACKEND_API_KEY.
vault_conversation_api_key: "CHANGE_ME"
vault_gradium_api_key: "CHANGE_ME"
vault_redis_password: "CHANGE_ME"

# Genesys Audio Connector connection-auth (TASK-INFRA-015). The AudioHook HMAC uses
# an api key (sent as X-API-KEY) and a base64-encoded shared secret that the runtime
# base64-decodes and keys HMAC-SHA256 with. Generate our own pair for the pre-live
# self-test (openssl rand -base64 32 for the secret); rotate to the Genesys-admin-
# agreed shared secret before the live-org test. Only used when voice_genesys is on.
vault_genesys_audiohook_api_key: "CHANGE_ME"
vault_genesys_audiohook_secret: "CHANGE_ME"   # base64

# WebRTC TURN relay credential (open input #12). Only needed once a TURN relay is
# provisioned and voice_turn / voice_turn_username are set in group_vars/voice.yml.
# Leave empty for the web pilot's STUN / host-candidate-only default (VOICE_TURN unset);
# voice.env.j2 renders it with `| default('')`, so an empty/absent value is safe.
vault_turn_credential: ""

# Private registry pull credentials (only used when registry_login_required=true).
vault_registry_username: ""
vault_registry_token: ""
