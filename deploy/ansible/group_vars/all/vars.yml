---
# Global, non-secret deploy variables (TASK-OPS-002, ADR-0038).
# Secrets live in group_vars/all/vault.yml (ansible-vault, git-ignored).

# ---- Image registry (open input #5: GHCR default vs internal Nexus) --------
registry: "ghcr.io"
registry_namespace: "tgrimaud"

# Image version to deploy. Override on the CLI with the immutable tag produced by
# TASK-OPS-001. The image tag has NO leading v (git tag vX.Y.Z -> image tag X.Y.Z,
# metadata-action {{version}}): e.g. -e image_tag=0.4.0 or -e image_tag=sha-abc1234.
image_tag: "latest"

# GHCR packages are PRIVATE (user decision 2026-08-05): the VMs authenticate with a
# read-only token before pulling. Provide vault_registry_username (GitHub user) +
# vault_registry_token (PAT with read:packages) in the vault; the compose_tier role
# runs `docker login` before pull when this is true.
registry_login_required: true

# ---- Target layout ---------------------------------------------------------
# Per-tier stack directory on each VM (compose file + rendered .env live here).
compose_root: "/opt/voice-support"

# Compose command on the target: `podman compose` delegating to the Docker Compose v2
# binary installed as podman's compose provider (TASK-INFRA-008 / ADR-0038 addendum).
compose_cmd: "podman compose"

# ---- Centralized observability (TASK-OPS-007, ADR-0028 addendum) -----------
# ONE OTLP endpoint where the backend + voice tiers ship traces/metrics so a call is one
# cross-tier trace and p50/p95/p99 by slice aggregate in one place (Prometheus). Bring the
# collector up on the chosen observability host with deploy/observability/docker-compose.otel.yml.
#
# Default EMPTY = export stays OFF everywhere (safe: nothing is shipped, no dangling
# endpoint, offline/normal startup unchanged). Set it to the collector's OTLP-HTTP base
# URL to enable export on the next deploy, e.g.:
#   -e otel_collector_endpoint=http://obs.tst.internal:4318
# The backend derives /v1/metrics + /v1/traces from this base; the voice runtime uses it
# as-is (OTEL_EXPORTER_OTLP_ENDPOINT). Both are additive and never block a turn if the
# collector is down (OTLP export is async/best-effort).
otel_collector_endpoint: ""

# Trace sampling ratio applied ONLY when export is enabled (endpoint set). 1.0 = keep every
# trace, sane for a low-volume pilot so cross-tier traces are complete; lower it if volume
# grows. A voice-initiated call carries a sampled traceparent, so the backend keeps it
# regardless (ParentBased sampler) — this ratio governs backend-originated (root) traces.
otel_traces_sampler_arg: "1.0"
