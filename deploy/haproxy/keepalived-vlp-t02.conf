# Keepalived - vlp-ai4cc-t02 (.101, fontvieille-dc3) = BACKUP for both VIPs.
# TASK-INFRA-002 / ADR-0038. Deploy to /etc/keepalived/keepalived.conf on t02.
# Validate on host: keepalived -t -f /etc/keepalived/keepalived.conf
#
# Unicast VRRP (peer = t01 .100): the two LB nodes are in different AZs, where
# multicast VRRP may not cross the L3 boundary. virtual_router_id and auth_pass
# MUST match the t01 values per VIP; only state/priority/unicast_* differ.

# Same penalty as t01 (BUG-006): the weight must cross the peer priority so the VIP
# always sits on a node whose HAProxy is up. Kept identical on both nodes so that,
# after a failover, a subsequent HAProxy death on the new holder also releases the VIP.
vrrp_script chk_haproxy {
    script "/usr/bin/killall -0 haproxy"
    interval 2
    weight -60
    fall 2
    rise 2
}

vrrp_instance VOICE_VIP {
    state BACKUP
    interface eth0            # CONFIRM interface name with the platform team
    virtual_router_id 51
    priority 100
    advert_int 1
    unicast_src_ip 192.168.0.101
    unicast_peer {
        192.168.0.100
    }
    authentication {
        auth_type PASS
        auth_pass CHANGE_ME_VRRP
    }
    virtual_ipaddress {
        192.168.0.10/24
    }
    track_script {
        chk_haproxy
    }
}

vrrp_instance BACKEND_VIP {
    state BACKUP
    interface eth0            # CONFIRM interface name with the platform team
    virtual_router_id 52
    priority 100
    advert_int 1
    unicast_src_ip 192.168.0.101
    unicast_peer {
        192.168.0.100
    }
    authentication {
        auth_type PASS
        auth_pass CHANGE_ME_VRRP
    }
    virtual_ipaddress {
        192.168.0.11/24
    }
    track_script {
        chk_haproxy
    }
}
