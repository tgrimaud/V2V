# Keepalived - vlp-ai4cc-t02 (.101, fontvieille-dc3) = BACKUP for both VIPs.
# TASK-INFRA-002 / ADR-0038. Deploy to /etc/keepalived/keepalived.conf on t02.
# Validate on host: keepalived -t -f /etc/keepalived/keepalived.conf
#
# Same open inputs as t01: interface name, virtual_router_id uniqueness, the
# shared VRRP auth secret, and the voice Prod IP mapping. virtual_router_id and
# auth_pass MUST match the t01 values per VIP; only state/priority differ.

vrrp_script chk_haproxy {
    script "/usr/bin/killall -0 haproxy"
    interval 2
    weight -40
    fall 2
    rise 2
}

vrrp_instance VOICE_VIP {
    state BACKUP
    interface eth0            # CONFIRM interface name with the platform team
    virtual_router_id 51
    priority 100
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass CHANGE_ME_VRRP
    }
    virtual_ipaddress {
        192.168.0.10/24
    }
    track_script {
        chk_haproxy
    }
}

vrrp_instance BACKEND_VIP {
    state BACKUP
    interface eth0            # CONFIRM interface name with the platform team
    virtual_router_id 52
    priority 100
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass CHANGE_ME_VRRP
    }
    virtual_ipaddress {
        192.168.0.11/24
    }
    track_script {
        chk_haproxy
    }
}
