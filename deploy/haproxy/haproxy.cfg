# HAProxy config for the eir-ai4cc-tst VIPs (TASK-INFRA-002, ADR-0038/ADR-0033).
# Runs on vlp-t01/t02 (.100/.101); the VIPs .10/.11 float via Keepalived (VRRP).
#
# Scope: HAProxy is the TLS edge + L7 load balancer for the voice WebRTC
# *signaling*/UI (HTTPS) and the internal backend HTTP API. It does NOT carry
# WebRTC *media*: RTP/SRTP is UDP and flows peer-to-peer to the bridge that
# answered the SDP offer, not through HAProxy. Media reachability for Prodpriv
# clients needs STUN/TURN (open input, out of scope here). See README.md.
#
# Validate:  haproxy -c -f haproxy.cfg   (see qa-validate-haproxy.sh)

global
    log stdout format raw local0 info
    maxconn 20000
    # Admin socket - used by the TASK-OPS-002 voice drain to set a bridge to
    # "drain"/"ready" (see README.md, "Voice draining hook").
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    # Modern TLS at the voice edge.
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option forwardfor
    option http-keep-alive
    timeout connect 5s
    timeout client 65s
    timeout server 65s
    # WebSocket/long-poll upgrades on the signaling path keep the tunnel open.
    timeout tunnel 1h
    default-server inter 3s fall 3 rise 2 maxconn 5000

# ---- Voice VIP .10 : TLS edge for WebRTC signaling + web UI -----------------
frontend voice_https
    bind 192.168.0.10:443 ssl crt /etc/haproxy/certs/voice-vip.pem alpn h2,http/1.1
    http-request set-header X-Forwarded-Proto https
    # Abuse control at the public TLS edge (TASK-INFRA-004): track each source IP's
    # connection rate + HTTP request rate and shed bursts *before* they reach the
    # bridges. This guards the signaling/UI HTTP surface only — WebRTC *media* is UDP
    # and peer-to-peer (not proxied), so a call's audio is never rate-limited here.
    # Thresholds are pilot defaults (generous for a browser: many asset loads per page);
    # tune with live traffic. conn_rate/http_req_rate are 10s sliding windows.
    stick-table type ip size 100k expire 10m store conn_rate(10s),http_req_rate(10s)
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc0_conn_rate gt 50 }
    http-request deny deny_status 429 if { sc0_http_req_rate gt 100 }
    default_backend voice_bridges

backend voice_bridges
    balance roundrobin
    option httpchk
    http-check send meth GET uri /
    http-check expect status 200
    # No stickiness needed: the SDP offer POST establishes the session on the
    # bridge that answers, and media pins to that bridge's ICE candidate.
    server vla-t01 192.168.0.103:8090 check
    server vla-t02 192.168.0.104:8090 check

# ---- Backend VIP .11 : internal HTTP load balancer -------------------------
frontend backend_http
    bind 192.168.0.11:8080
    default_backend backend_java

backend backend_java
    balance roundrobin
    option httpchk
    # Deep, dependency-aware health (TASK-INFRA-007): /actuator/health aggregates the
    # DB (DataSource) indicator — and Redis when REDIS_HEALTH_ENABLED=true — and returns
    # 503 when a dependency is down, so a backend with Postgres/Redis broken leaves
    # rotation (fall 3). /api/health was a static UP that never reflected degradation.
    # This is the same endpoint the Ansible deploy already polls (group_vars/backend.yml).
    http-check send meth GET uri /actuator/health
    http-check expect status 200
    server vla-t03 192.168.0.105:8080 check
    server vla-t04 192.168.0.106:8080 check

# ---- Stats UI (admin interface only) ---------------------------------------
frontend stats
    bind 127.0.0.1:8404
    stats enable
    stats uri /stats
    stats refresh 10s
