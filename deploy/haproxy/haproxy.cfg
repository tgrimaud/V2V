# HAProxy config for the eir-ai4cc-tst VIPs (TASK-INFRA-002, ADR-0038/ADR-0046).
# Runs on vlp-t01/t02 (.100/.101); the VIPs .10/.11 float via Keepalived (VRRP).
#
# Scope: HAProxy is the TLS edge + L7 load balancer for (a) the voice web UI +
# WebRTC signaling (HTTPS -> :8090), (b) the PRIMARY live voice transport, a
# WebSocket audio tunnel (`Upgrade: websocket` -> :8091, ADR-0046/TASK-WEB-037),
# and (c) the internal backend HTTP API. The live voice audio now flows THROUGH
# HAProxy over the wss tunnel (TCP, no TURN). It still does NOT carry WebRTC
# *media*: RTP/SRTP is UDP + peer-to-peer, and WebRTC is now an optional
# same-subnet/dev path only (needs STUN/TURN off-subnet). See README.md.
#
# Validate:  haproxy -c -f haproxy.cfg   (see qa-validate-haproxy.sh)

global
    log stdout format raw local0 info
    maxconn 20000
    # Admin socket - used by the TASK-OPS-002 voice drain to set a bridge to
    # "drain"/"ready" (see README.md, "Voice draining hook").
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    # Modern TLS at the voice edge.
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option forwardfor
    option http-keep-alive
    timeout connect 5s
    timeout client 65s
    timeout server 65s
    # WebSocket/long-poll upgrades on the signaling path keep the tunnel open.
    timeout tunnel 1h
    default-server inter 3s fall 3 rise 2 maxconn 5000

# ---- Voice VIP .10 : TLS edge for WebRTC signaling + web UI -----------------
frontend voice_https
    bind 192.168.0.10:443 ssl crt /etc/haproxy/certs/voice-vip.pem alpn h2,http/1.1
    http-request set-header X-Forwarded-Proto https
    # Abuse control at the public TLS edge (TASK-INFRA-004): track each source IP's
    # connection rate + HTTP request rate and shed bursts *before* they reach the
    # bridges. This guards the signaling/UI HTTP surface only — WebRTC *media* is UDP
    # and peer-to-peer (not proxied), so a call's audio is never rate-limited here.
    # Thresholds are pilot defaults (generous for a browser: many asset loads per page);
    # tune with live traffic. conn_rate/http_req_rate are 10s sliding windows.
    stick-table type ip size 100k expire 10m store conn_rate(10s),http_req_rate(10s)
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc0_conn_rate gt 50 }
    http-request deny deny_status 429 if { sc0_http_req_rate gt 100 }
    # Live voice WebSocket routing (ADR-0046, TASK-WEB-037 / TASK-INFRA-010): a browser
    # `new WebSocket(...)` (and Genesys Audio Connector) opens an HTTP/1.1 request with
    # `Upgrade: websocket` — browsers never use h2 for WebSocket, so this matches even on
    # the h2,http/1.1 bind. Steer those to the bridges' WS server (:8091); everything else
    # (UI, WebRTC signaling) stays on :8090. The global `timeout tunnel 1h` holds the call's
    # socket open for its whole life. No TURN/UDP is involved (ADR-0042/0043).
    acl is_voice_ws hdr(Upgrade) -i websocket
    use_backend voice_ws if is_voice_ws
    default_backend voice_bridges

backend voice_bridges
    balance roundrobin
    option httpchk
    http-check send meth GET uri /
    http-check expect status 200
    # No stickiness needed for HTTP: the WebRTC SDP offer POST establishes the session on
    # the bridge that answers, and media pins to that bridge's ICE candidate.
    server vla-t01 192.168.0.103:8090 check
    server vla-t02 192.168.0.104:8090 check

# ---- Live voice WebSocket backend (ADR-0046) --------------------------------
backend voice_ws
    # Call affinity: `balance source` hashes the client IP so a caller pins to one bridge
    # for the whole call. The socle WS transport is single-client per listener (ADR-0043),
    # so a call MUST stay on the bridge that accepted its socket; a mid-call rehash would
    # break audio. (Pilot concurrency is low; a listener-per-session topology is deferred.)
    balance source
    # Plain TCP connect check: :8091 is a raw WebSocket server (websockets lib), NOT an HTTP
    # endpoint that answers 200 on `GET /`, so `option httpchk` would wrongly mark it down.
    server vla-t01 192.168.0.103:8091 check
    server vla-t02 192.168.0.104:8091 check

# ---- Backend VIP .11 : internal HTTP load balancer -------------------------
frontend backend_http
    # Binds the backend VIP on :80 (plain HTTP). The voice tier's VOICE_BACKEND_URL
    # is the server base (http://192.168.0.11, i.e. :80) since BUG-013 — do NOT bind
    # :8080 here (that is the backend Java node port, below). Verified live on vlp-t01
    # (ss -ltnp -> 192.168.0.11:80). See AGENTS.md and group_vars/voice.yml.
    bind 192.168.0.11:80
    default_backend backend_java

backend backend_java
    balance roundrobin
    option httpchk
    # Deep, dependency-aware health (TASK-INFRA-007): /actuator/health aggregates the
    # DB (DataSource) indicator — and Redis when REDIS_HEALTH_ENABLED=true — and returns
    # 503 when a dependency is down, so a backend with Postgres/Redis broken leaves
    # rotation (fall 3). /api/health was a static UP that never reflected degradation.
    # This is the same endpoint the Ansible deploy already polls (group_vars/backend.yml).
    http-check send meth GET uri /actuator/health
    http-check expect status 200
    server vla-t03 192.168.0.105:8080 check
    server vla-t04 192.168.0.106:8080 check

# ---- Stats UI (admin interface only) ---------------------------------------
frontend stats
    bind 127.0.0.1:8404
    stats enable
    stats uri /stats
    stats refresh 10s
