# Keepalived - vlp-ai4cc-t01 (.100, costa-dc1) = MASTER for both VIPs.
# TASK-INFRA-002 / ADR-0038. Deploy to /etc/keepalived/keepalived.conf on t01.
# Validate on host: keepalived -t -f /etc/keepalived/keepalived.conf
#
# Unicast VRRP is used on purpose: the two LB nodes sit in different AZs
# (costa-dc1 / fontvieille-dc3), where multicast VRRP (224.0.0.18) may not cross
# the L3 boundary. Unicast peering works on both stretched-L2 and routed setups.
#
# Confirm with the platform team (open inputs): the network interface name,
# unique virtual_router_id values (no VRRP clash on the segment), the VRRP auth
# secret, and how the voice Prod IP 10.195.59.39 maps to the private VIP .10.

# Lower this node's VRRP priority if HAProxy is not running, so the VIP fails over.
vrrp_script chk_haproxy {
    script "/usr/bin/killall -0 haproxy"
    interval 2
    weight -40
    fall 2
    rise 2
}

vrrp_instance VOICE_VIP {
    state MASTER
    interface eth0            # CONFIRM interface name with the platform team
    virtual_router_id 51
    priority 150
    advert_int 1
    unicast_src_ip 192.168.0.100
    unicast_peer {
        192.168.0.101
    }
    authentication {
        auth_type PASS
        auth_pass CHANGE_ME_VRRP   # set the same secret on both nodes
    }
    virtual_ipaddress {
        192.168.0.10/24
    }
    track_script {
        chk_haproxy
    }
}

vrrp_instance BACKEND_VIP {
    state MASTER
    interface eth0            # CONFIRM interface name with the platform team
    virtual_router_id 52
    priority 150
    advert_int 1
    unicast_src_ip 192.168.0.100
    unicast_peer {
        192.168.0.101
    }
    authentication {
        auth_type PASS
        auth_pass CHANGE_ME_VRRP
    }
    virtual_ipaddress {
        192.168.0.11/24
    }
    track_script {
        chk_haproxy
    }
}
