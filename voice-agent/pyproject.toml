[project]
name = "voice-support-agent"
version = "0.1.0"
description = "Pipecat voice agent for Telecom support using Gradium STT/TTS"
requires-python = ">=3.11"
dependencies = [
    # webrtc + runner extras and the prebuilt UI power strategy B (agent/bot.py:
    # unified Pipecat web WebRTC + telephony). websocket/silero/gradium are shared.
    "pipecat-ai[gradium,websocket,silero,webrtc,runner]",
    "pipecat-ai-prebuilt",
    "httpx",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "coverage",
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
voice-agent = "agent.bridge_server:run"

[tool.coverage.run]
source = ["agent"]
omit = [
    "agent/bot.py",
    "agent/bridge_server.py",
    "agent/main.py",
    "agent/twilio_server.py",
    "agent/ws_server.py",
]

[tool.coverage.report]
show_missing = true
